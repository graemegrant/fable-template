name: Security Audit

# `guardrails.yml` now runs this same audit (plus a secret scan) as a
# blocking check on every push/PR, so this workflow's job is narrower:
# catch a dependency that *becomes* vulnerable after merge, when a new
# CVE is disclosed against something already sitting in package-lock.json
# with no new PR to trigger a re-check.
on:
  schedule:
    - cron: '0 8 * * 1'   # every Monday, 08:00 UTC
  workflow_dispatch: {}     # allow manual trigger from the Actions tab

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: npm ci
      - name: npm audit (high/critical only, allowlist-aware — see .audit-ci.jsonc)
        run: npx audit-ci --config .audit-ci.jsonc
